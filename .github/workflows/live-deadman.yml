name: Live dead-man's switch

# External heartbeat check (NASDAQ/docs/05 §6): if today was a session and no
# Cycle A record exists after 18:00 ET, the decision cycle silently died —
# file a P1. Runs OUTSIDE cycle A on purpose; crons at 22:15 and 23:15 UTC so
# at least one lands after 18:00 ET in either DST regime (the script no-ops
# before the deadline, and P1 issues are deduped per day).
#
# NOTE: scheduled workflows only fire once this file exists on the repository's
# DEFAULT branch.

on:
  schedule:
    - cron: "15 22,23 * * 1-5"

permissions:
  contents: read
  issues: write

concurrency:
  group: live-deadman
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/tasi-agent-simulation-fcili2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet pandas numpy pandas_market_calendars

      - name: Check the heartbeat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python NASDAQ/live/deadman.py

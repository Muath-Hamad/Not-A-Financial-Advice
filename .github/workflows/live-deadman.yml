name: Live dead-man's switch

# External heartbeat checks (NASDAQ/docs/05 §6, docs/07). Each runs OUTSIDE
# the step it watches and files a P1 (deduped per day) when that step
# silently never happened:
#
# * Cycle A — if today was a session and no Cycle A record exists after
#   18:00 ET. Crons at 22:15 and 23:15 UTC so at least one lands after
#   18:00 ET in either DST regime.
# * Submit (paper mode only) — if orders were ledgered tonight but no submit
#   record exists after 21:00 ET. Crons at 01:30 and 02:30 UTC (the next UTC
#   day, hence 2-6) so at least one lands after 21:00 ET in either regime.
#
# The script no-ops before each deadline, and stays quiet while the watched
# workflow has a run queued or in progress (a late step is not a dead one).
# GitHub fires these crons hours late and drops most slots, so every scheduled
# run performs both checks.
#
# * After every Cycle A run that ends without success (workflow_run): the
#   session must have a record on main — catches a timeout, a lost runner or a
#   ledger push that never landed, which the scheduled check may have missed
#   while that run was still in flight. A successful run recorded its session
#   or exited on purpose (already recorded, too early, too late).
#
# Scheduled and workflow_run triggers only fire from the repository's DEFAULT
# branch (main).

on:
  schedule:
    - cron: "15 22,23 * * 1-5"
    - cron: "30 1,2 * * 2-6"
  workflow_run:
    workflows: ["Live cycle A (decision)"]
    types: [completed]

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  check:
    # a push-triggered Cycle A is a smoke drill that records nothing real. The
    # concurrency group sits on the job, so a skipped run never takes its slot
    # (or displaces a pending check).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event != 'push'
    concurrency:
      group: live-deadman
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet pandas numpy pandas_market_calendars

      - name: Check the Cycle A heartbeat
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python NASDAQ/live/deadman.py

      - name: Check the submit heartbeat
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          LIVE_MODE: ${{ vars.LIVE_MODE || 'ghost' }}
        run: python NASDAQ/live/deadman.py --submit

      - name: Check that the failed Cycle A left a record
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: python NASDAQ/live/deadman.py --after-cycle-a

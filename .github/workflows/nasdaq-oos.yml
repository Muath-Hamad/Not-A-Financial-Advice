name: NASDAQ out-of-sample data (post-freeze)

on:
  push:
    branches:
      - claude/tasi-agent-simulation-fcili2
    paths:
      - ".github/workflows/nasdaq-oos.yml"

permissions:
  contents: write

concurrency:
  group: nasdaq-oos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet yfinance pandas requests

      - name: Fetch full history 2015 -> latest (agents already frozen)
        env:
          FETCH_START: "2015-01-01"
          FETCH_END: "2026-08-06"
          FETCH_RAW_SUBDIR: data/raw_full
        run: python NASDAQ/pipeline/fetch_data.py

      - name: Commit data back to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NASDAQ/data/raw_full
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: NASDAQ full history through latest (out-of-sample extension, post-freeze)"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push || (sleep 5 && git pull --rebase origin "${{ github.ref_name }}" && git push)
          fi

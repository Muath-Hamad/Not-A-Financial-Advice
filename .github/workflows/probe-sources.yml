name: Probe second data sources (temporary)

on:
  push:
    branches:
      - claude/tasi-agent-simulation-fcili2
    paths:
      - ".github/workflows/probe-sources.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: NASDAQ chart API index symbols
        run: |
          for q in "COMP/chart?assetclass=index" "NDX/chart?assetclass=index"; do
            echo "== $q"
            curl -sS -m 20 -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
              -H "Accept: application/json, text/plain, */*" -H "Accept-Language: en-US" \
              "https://api.nasdaq.com/api/quote/$q&fromdate=2026-08-14&todate=2026-08-17" | head -c 700 || true
            echo
          done

name: Live cycle B (reconciliation)

# Post-open reconciliation (NASDAQ/docs/05 §3), ~09:50 ET. Crons at 13:50 and
# 14:50 UTC so one lands at 09:50 ET in either DST regime; the script skips
# pre-open slots and already-recorded days. Push to this file = smoke run.
#
# NOTE: scheduled workflows only fire once this file exists on the repository's
# DEFAULT branch.

on:
  push:
    branches:
      - claude/tasi-agent-simulation-fcili2
    paths:
      - ".github/workflows/live-cycle-b.yml"
  schedule:
    - cron: "50 13,14 * * 1-5"

permissions:
  contents: write
  issues: write

concurrency:
  group: live-cycle-b
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/tasi-agent-simulation-fcili2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet pandas numpy yfinance requests pandas_market_calendars

      - name: Run cycle B (smoke — push-triggered)
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIVE_MODE: ghost
        run: python NASDAQ/live/cycle_b.py --smoke

      - name: Run cycle B
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          LIVE_MODE: ${{ vars.LIVE_MODE || 'ghost' }}
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python NASDAQ/live/cycle_b.py

      - name: Commit ledger back to branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NASDAQ/live/ledger
          if git diff --cached --quiet; then
            echo "No ledger changes to commit"
          else
            git commit -m "live: cycle B record ($(date -u +%F))"
            git pull --rebase origin claude/tasi-agent-simulation-fcili2 || true
            git push || (sleep 5 && git pull --rebase origin claude/tasi-agent-simulation-fcili2 && git push)
          fi

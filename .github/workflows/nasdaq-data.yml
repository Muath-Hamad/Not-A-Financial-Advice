name: NASDAQ sharia-screened data

on:
  push:
    branches:
      - claude/tasi-agent-simulation-fcili2
    paths:
      - ".github/workflows/nasdaq-data.yml"

permissions:
  contents: write

concurrency:
  group: nasdaq-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet yfinance pandas requests

      - name: Discover top NASDAQ names by market cap
        run: python NASDAQ/pipeline/discover_universe.py

      - name: AAOIFI shariah screen
        run: python NASDAQ/pipeline/sharia_screen.py

      - name: Fetch in-sample history (2015 -> 2022, stage 1)
        env:
          FETCH_START: "2015-01-01"
          FETCH_END: "2023-01-01"
          FETCH_RAW_SUBDIR: data/raw_is
        run: python NASDAQ/pipeline/fetch_data.py

      - name: Commit data back to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NASDAQ/data/universe_top.json NASDAQ/data/universe_screened.json NASDAQ/data/raw_is
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: NASDAQ AAOIFI-screened universe + in-sample history 2015-2022"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push || (sleep 5 && git pull --rebase origin "${{ github.ref_name }}" && git push)
          fi
